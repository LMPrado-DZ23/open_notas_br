[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "notasbr"
version = "0.1.0"
description = "Auditoria offline de documentos fiscais brasileiros: NF-e, NFC-e e CT-e"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leandro Prado" }]
keywords = ["nfe", "nfce", "cte", "fiscal", "brasil", "xml", "sefaz", "auditoria"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# API HTTP. O núcleo funciona sem nenhuma destas dependências.
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "python-multipart>=0.0.9",
]
# Verificação criptográfica de XMLDSig. Sem isto, a assinatura só é conferida
# estruturalmente (presença, Reference, DigestValue) — não criptograficamente.
assinatura = [
  "signxml>=3.2",
  "cryptography>=42",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/LMPrado-DZ23/open_notas_br"
Repositorio = "https://github.com/LMPrado-DZ23/open_notas_br"
Issues = "https://github.com/LMPrado-DZ23/open_notas_br/issues"

[project.scripts]
notasbr = "notasbr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notasbr"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:notasbr.*"]

[tool.mypy]
python_version = "3.10"
files = ["src/notasbr"]
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["notasbr"]
omit = ["*/api.py"]
