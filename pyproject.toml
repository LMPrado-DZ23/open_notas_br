[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "notasbr"
version = "0.2.0"
description = "Auditoria offline e motor de emissão de documentos fiscais brasileiros (NF-e, NFC-e, CT-e, NFS-e Nacional)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leandro Prado" }]
keywords = [
  "nfe", "nfce", "cte", "nfse", "fiscal", "brasil", "xml", "sefaz", "sefin",
  "danfse", "reforma-tributaria", "ibs", "cbs", "multi-tenant",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Portuguese (Brazilian)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]

# O núcleo (biblioteca `notasbr` de auditoria) continua SEM dependências.
# Todo o stack de servidor vive no extra `app`.
dependencies = []

[project.optional-dependencies]
app = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "redis>=5.0",
  "arq>=0.26",
  "cryptography>=42",
  "httpx>=0.27",
  # Base IANA de fusos horarios: obrigatoria no Windows e em imagens sem tzdata.
  "tzdata>=2024.1",
  # XMLDSig: assinatura da DPS. `lxml` entrega C14N correto; implementar
  # canonicalizacao a mao e a causa mais comum de assinatura recusada.
  "lxml>=5.2",
  "signxml>=3.2",
  # DANFSe local (Fase 4). ReportLab e Python puro: roda em Linux e Windows sem
  # dependencia nativa, diferente de WeasyPrint (pango/cairo).
  "reportlab>=4.2",
  # QR Code do cupom NFC-e. `segno` é Python puro e gera PNG sem Pillow.
  "segno>=1.6",
]
# Geração local de DANFSe/DANFE (Fase 4).
pdf = [
  "weasyprint>=62",
  "jinja2>=3.1",
]
# Verificação e geração de XMLDSig (Fase 2).
assinatura = [
  "signxml>=3.2",
  "cryptography>=42",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
  # Extrator de texto de PDF, usado no teste de fidelidade XML -> PDF.
  "pypdf>=5.0",
]

[project.urls]
Homepage = "https://github.com/LMPrado-DZ23/open_notas_br"
Repositorio = "https://github.com/LMPrado-DZ23/open_notas_br"
Issues = "https://github.com/LMPrado-DZ23/open_notas_br/issues"

[project.scripts]
notasbr = "notasbr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notasbr", "app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "I001"]
# B008: `Depends(...)` em valor padrão é a forma canônica de injeção do FastAPI,
# não um bug. O aviso do Ruff é falso positivo neste contexto.
"app/api/*" = ["B008"]
"app/api/**/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integracoes: testes que exigem PostgreSQL/Redis reais",
]
filterwarnings = ["error::DeprecationWarning:notasbr.*", "error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.12"
files = ["src/notasbr", "app"]
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["notasbr", "app"]
omit = ["*/alembic/*", "*/tests/*", "*/scripts/*"]

[tool.coverage.report]
# Piso de cobertura do projeto. Módulos fiscais e de segurança devem ficar acima
# de 80% (critério de go-live); o total medido é 85%.
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]
