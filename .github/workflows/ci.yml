name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    name: Testes e lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: notasbr
          POSTGRES_PASSWORD: notasbr
          POSTGRES_DB: notasbr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notasbr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Os testes criam e derrubam o próprio banco (`notasbr_test`) a partir desta
      # URL administrativa. Ver tests/suporte.py.
      TEST_DATABASE_URL: postgresql+asyncpg://notasbr:notasbr@127.0.0.1:5432/notasbr
      DATABASE_URL: postgresql+asyncpg://notasbr:notasbr@127.0.0.1:5432/notasbr_test
      REDIS_URL: redis://127.0.0.1:6379/0
      ENVIRONMENT: test
      NFSE_ADAPTER: mock

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Testes com cobertura
        run: pytest --cov=app --cov=notasbr --cov-report=term-missing

      - name: Guardar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: .coverage
          if-no-files-found: ignore

  contrato:
    name: Contrato e schemas oficiais
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Estes testes não precisam de banco: validam XML contra os XSD oficiais e o
      # contrato da SEFIN contra respostas reais capturadas.
      - name: Validar XML contra XSD e contrato da SEFIN
        run: |
          pytest tests/test_schema_dps.py \
                 tests/test_evento_cancelamento.py \
                 tests/test_eventos_tipos.py \
                 tests/test_contrato_sefin_real.py \
                 tests/test_openapi_sincronizado.py -v
