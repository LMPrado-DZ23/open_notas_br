name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,api]"

      - name: Lint
        run: python -m ruff check .

      - name: Formatação
        run: python -m ruff format --check .

      - name: Testes
        run: python -m pytest -q

  nucleo-sem-dependencias:
    name: Núcleo instala sem dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Garante que o pacote-base não arrasta FastAPI, lxml ou signxml.
      - name: Instalar apenas o núcleo
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verificar que o núcleo não importa extras
        run: |
          python - <<'PY'
          import importlib.util
          import notasbr

          print("notasbr", notasbr.__version__)
          for proibido in ("fastapi", "lxml", "signxml", "cryptography"):
              if importlib.util.find_spec(proibido) is not None:
                  raise SystemExit(f"dependência opcional instalada por engano: {proibido}")
          print("núcleo limpo")
          PY

      - name: CLI responde
        run: |
          notasbr --version
          notasbr regras --json > /dev/null
