  adendo: "Adendo 3 — Evidências oficiais"
  data_acesso: "2026-11-27"
  fuso: "America/Sao_Paulo"
  agente: dsh
  maquina: "Windows / PowerShell 7"
  observacao: >
    Todo `sha256` abaixo foi calculado com `Get-FileHash -Algorithm SHA256` ou `hashlib.sha256` sobre o
    arquivo salvo em `sources/oficiais/`. Os arquivos estão versionados junto deste manifesto para que o
    hash seja reverificável offline.

