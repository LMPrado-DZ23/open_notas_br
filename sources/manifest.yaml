# Manifesto de fontes oficiais — NFS-e / DF-e
#
# Regra deste arquivo (Adendo 3): só entra o que foi **baixado de fonte oficial** nesta execução, com
# URL direta, órgão, título, data de acesso e SHA-256 calculado sobre os bytes recebidos. Nada aqui é
# transcrição de memória, blog ou exemplo de terceiro.
#
# `status_coleta`:
#   coletado        — arquivo baixado e hash calculado nesta execução
#   nao_encontrado  — procurei na página oficial e não existe link/arquivo correspondente
#   nao_verificado  — existe a página, mas o conteúdo necessário não foi obtido

